<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paracon OS — Offline</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #faf9f6;
        color: #1c1b17;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      img { height: 28px; margin-bottom: 24px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #6b6a63; max-width: 320px; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/logo-ink-on-paper.jpg" alt="Paracon" />
      <h1>You're offline</h1>
      <p>
        Saved locally — this page will sync automatically once you're back online.
      </p>
    </div>
  </body>
</html>
